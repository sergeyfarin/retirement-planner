<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<style>
			@font-face {
				font-family: 'Inter';
				src: url('%sveltekit.assets%/fonts/inter-variable.woff2') format('woff2');
				font-style: normal;
				font-weight: 100 900;
				font-display: swap;
			}

			@font-face {
				font-family: 'JetBrains Mono';
				src: url('%sveltekit.assets%/fonts/jetbrains-mono-variable.woff2') format('woff2');
				font-style: normal;
				font-weight: 100 800;
				font-display: swap;
			}

			html,
			body {
				min-height: 100%;
			}

			body {
				margin: 0;
				font-family:
					'Inter',
					system-ui,
					-apple-system,
					sans-serif;
				background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #f0fdf4 100%);
				background-attachment: fixed;
				background-repeat: no-repeat;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
