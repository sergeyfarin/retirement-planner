name: Deploy Pages

# This workflow is inert until the repository variable below is explicitly enabled AND
# an operator dispatches it from main with deploy checked. It never publishes a release.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy main to GitHub Pages'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.deploy && vars.RETIREMENT_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require successful main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh api --paginate "repos/$GH_REPO/actions/workflows/publish-dist.yml/runs?event=push&branch=main&head_sha=$COMMIT_SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .id' > /tmp/passing-runs
          test -s /tmp/passing-runs || { echo 'No successful main CI run for this commit'; exit 1; }
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: 'ressim-benchmark-cache'
          workspaces: rust-engine -> target
      - run: wasm-pack build --target web
        working-directory: rust-engine
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:root
      - name: Configure custom domain in artifact
        run: printf '%s\n' 'retirement.rekenraam.com' > build/CNAME
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
