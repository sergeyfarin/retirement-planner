name: Deploy Pages

on:
  workflow_run:
    workflows: ['Publish Dist']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy main to GitHub Pages'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: >-
      vars.RETIREMENT_PAGES_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy))
    runs-on: ubuntu-latest
    env:
      TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
      - name: Require successful main CI for this commit
        run: TARGET_SHA=$(git rev-parse HEAD) bash scripts/check-pages-deployment.sh
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: 'ressim-benchmark-cache'
          workspaces: rust-engine -> target
      - run: wasm-pack build --target web
        working-directory: rust-engine
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:root
      - name: Configure custom domain in artifact
        run: printf '%s\n' 'retirement.rekenraam.com' > build/CNAME
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Hold the lock across the final head check and deployment. A delayed older
    # run can never deploy after a newer one, even after environment approval.
    concurrency:
      group: retirement-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
      - name: Recheck CI and current main before deploying
        run: TARGET_SHA=$(git rev-parse HEAD) bash scripts/check-pages-deployment.sh
      - id: deployment
        uses: actions/deploy-pages@v4
