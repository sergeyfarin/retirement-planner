name: Publish Dist

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Version is intentionally omitted: the action reads `packageManager` from
          # package.json. Pinning it here as well makes the two drift apart the moment
          # one is bumped, and the action hard-fails on a mismatch.
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ressim-benchmark-cache"
          workspaces: rust-engine -> target

      - name: Build wasm package
        run: wasm-pack build --target web
        working-directory: rust-engine

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      # Engine tests, including the TS<->Rust cross-engine parity suite. These need the
      # wasm package built above but no browser, so they run before the dist build and
      # fail fast if the two engines have drifted.
      - name: Run engine tests
        run: pnpm run test:engines

      - name: Build dist
        run: pnpm run build

      - name: Package dist artifact
        run: |
          ARCHIVE="retirement-dist.tar.gz"

          if [ -d "build" ]; then
            tar -czf "$ARCHIVE" -C build .
          elif [ -d "dist/retirement" ]; then
            tar -czf "$ARCHIVE" -C dist retirement
          elif [ -d "dist" ]; then
            tar -czf "$ARCHIVE" -C dist .
          else
            echo "No build output directory found (checked: build, dist/retirement, dist)."
            exit 1
          fi

          printf '{"commit":"%s","ref":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-build-meta.json

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: retirement-dist
          path: |
            retirement-dist.tar.gz
            dist-build-meta.json
          if-no-files-found: error
          retention-days: 14

  publish-release:
    runs-on: ubuntu-latest
    needs: build-artifact

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: retirement-dist

      - name: Set Release Tag
        run: echo "RELEASE_TAG=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

      - name: Publish stable release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dist-${{ env.RELEASE_TAG }}
          name: dist-${{ env.RELEASE_TAG }}
          files: |
            retirement-dist.tar.gz
            dist-build-meta.json
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
