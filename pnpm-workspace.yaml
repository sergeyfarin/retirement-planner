allowBuilds:
  # Postinstall verifies the native platform binary loads, falling back to `@swc/wasm`.
  '@swc/core': true
  # Reached only through plotly.js's gl traces (gl-text, regl-line2d), which the custom
  # bundle in src/lib/plotly.ts never imports. Its postinstall is a funding notice wrapped
  # in try/catch, so nothing needs it to run.
  es5-ext: false
  esbuild: true
overrides:
  # vite-plugin-top-level-await is CommonJS and `require`s uuid, but its pinned 10.0.0 is
  # deprecated and uuid 12+ dropped the CJS entry point. 11.x is the newest release that
  # still ships one; scope the override to that dependency so @inlang/sdk keeps uuid 14.
  'vite-plugin-top-level-await>uuid': 11.1.1
  # @swc/core 1.16.x serialises an AST that vite-plugin-top-level-await's `printSync`
  # rejects with `missing field \`type\``, breaking `vite build` (reproduced on 1.16.20).
  # Pin to the last 1.15 release until the plugin catches up.
  '@swc/core': 1.15.47
  '@swc/wasm': 1.15.47
# pnpm 12 quarantines releases younger than 24h (minimumReleaseAge). Add an exact
# `name@version` under `minimumReleaseAgeExclude` only while intentionally adopting a
# release inside that window.
