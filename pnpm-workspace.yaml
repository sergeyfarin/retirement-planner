allowBuilds:
  # Postinstall verifies the native platform binary loads, falling back to `@swc/wasm`.
  '@swc/core': true
  # Reached only through plotly.js's gl traces (gl-text, regl-line2d), which the custom
  # bundle in src/lib/plotly.ts never imports. Its postinstall is a funding notice wrapped
  # in try/catch, so nothing needs it to run.
  es5-ext: false
  esbuild: true
minimumReleaseAgeExclude:
  - '@rollup/rollup-android-arm-eabi@4.65.1'
  - '@rollup/rollup-android-arm64@4.65.1'
  - '@rollup/rollup-darwin-arm64@4.65.1'
  - '@rollup/rollup-darwin-x64@4.65.1'
  - '@rollup/rollup-freebsd-arm64@4.65.1'
  - '@rollup/rollup-freebsd-x64@4.65.1'
  - '@rollup/rollup-linux-arm-gnueabihf@4.65.1'
  - '@rollup/rollup-linux-arm-musleabihf@4.65.1'
  - '@rollup/rollup-linux-arm64-gnu@4.65.1'
  - '@rollup/rollup-linux-arm64-musl@4.65.1'
  - '@rollup/rollup-linux-loong64-gnu@4.65.1'
  - '@rollup/rollup-linux-loong64-musl@4.65.1'
  - '@rollup/rollup-linux-ppc64-gnu@4.65.1'
  - '@rollup/rollup-linux-ppc64-musl@4.65.1'
  - '@rollup/rollup-linux-riscv64-gnu@4.65.1'
  - '@rollup/rollup-linux-riscv64-musl@4.65.1'
  - '@rollup/rollup-linux-s390x-gnu@4.65.1'
  - '@rollup/rollup-linux-x64-gnu@4.65.1'
  - '@rollup/rollup-linux-x64-musl@4.65.1'
  - '@rollup/rollup-openbsd-x64@4.65.1'
  - '@rollup/rollup-openharmony-arm64@4.65.1'
  - '@rollup/rollup-win32-arm64-msvc@4.65.1'
  - '@rollup/rollup-win32-ia32-msvc@4.65.1'
  - '@rollup/rollup-win32-x64-gnu@4.65.1'
  - '@rollup/rollup-win32-x64-msvc@4.65.1'
  - rollup@4.65.1
overrides:
  # vite-plugin-top-level-await is CommonJS and `require`s uuid, but its pinned 10.0.0 is
  # deprecated and uuid 12+ dropped the CJS entry point. 11.x is the newest release that
  # still ships one; scope the override to that dependency so @inlang/sdk keeps uuid 14.
  'vite-plugin-top-level-await>uuid': 11.1.1
  # @swc/core 1.16.x serialises an AST that vite-plugin-top-level-await's `printSync`
  # rejects with `missing field \`type\``, breaking `vite build` (reproduced on 1.16.20).
  # Pin to the last 1.15 release until the plugin catches up.
  '@swc/core': 1.15.47
  '@swc/wasm': 1.15.47
# pnpm 12 quarantines releases younger than 24h (minimumReleaseAge). Add an exact
# `name@version` under `minimumReleaseAgeExclude` only while intentionally adopting a
# release inside that window.
